<!DOCTYPE html>
<html>
<head>
  <title>Mapa 3D Estoque OSG</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial; background: #f0f0f0; }
    canvas { display: block; }
    
    #menuLateral {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    .painel {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid #ddd;
    }

    #info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 10;
      min-width: 250px;
      max-height: 350px;
      overflow-y: auto;
      border-left: 5px solid #002D72;
      transition: all 0.3s ease;
    }

    /* Painel Lateral Direito (Prateleira Clicada) */
    #painelPrateleira {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: 85vh;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 10px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.2);
      border: 1px solid #ccc;
      z-index: 10;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .cabecalho-painel {
      background: #002D72;
      color: white;
      padding: 12px 15px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fechar-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .conteudo-painel {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
      transition: 0.2s;
    }
    .item-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .item-header {
      padding: 10px 12px;
      background: #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #334155;
      border-bottom: 1px solid #e2e8f0;
    }

    .item-details {
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      background: white;
      display: none;
    }

    .indicador-expand {
      transition: transform 0.2s;
    }
    .item-card.ativo .indicador-expand {
      transform: rotate(90deg);
    }

    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    button { 
      padding: 8px 15px; 
      cursor: pointer; 
      background: #002D72; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover { background: #001a4d; transform: scale(1.05); }

    .excel-label {
      display: block;
      padding: 10px;
      border: 2px dashed #007bff;
      border-radius: 8px;
      color: #007bff;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div id="menuLateral">
  <div class="painel">
    <input id="busca" placeholder="Digite o item (Ex: S0104...)">
    <button id="btnBuscar">Buscar</button>
  </div>

  <div class="painel">
    <label for="input-excel" class="excel-label">Importar Tabela Manualmente</label>
    <input type="file" id="input-excel" accept=".xlsx, .xls" style="display: none;">
  </div>
</div>

<!-- Info flutuante -->
<div id="info">Carregando sistema...</div>

<!-- Painel Acordeão Lateral Direito -->
<div id="painelPrateleira">
  <div class="cabecalho-painel">
    <span id="tituloPrateleira">POSIÇÃO: -</span>
    <button class="fechar-btn" onclick="fecharPainelPrateleira()">×</button>
  </div>
  <div class="conteudo-painel" id="listaLotesPrateleira"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

// ================== LINK DO SHAREPOINT ==================
const URL_TABELA_AUTOMATICA = "https://osgferramentas.sharepoint.com/:x:/r/sites/Manufatura/Documentos%20Compartilhados/Importacao_Kardex/Tabela2.xlsx?d=w37bae9cd83f741b09390a1550a2f3885&csf=1&download=1&e=t97BpH";

// ================== VARIÁVEIS GLOBAIS ==================
let lotes = JSON.parse(localStorage.getItem('estoque_osg_cache')) || {};
let modelo;
let objetoSelecionado = null;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// ================== PROCESSA LINHAS E FILTRA APENAS A MAIS RECENTE ==================
function processarDadosExcel(rows) {
    let novosLotes = {};

    rows.forEach((row, index) => {
        if (index === 0) return; // Ignores header

        const itemID    = row[0]; // Coluna A (Título)
        const ht        = row[1]; // Coluna B (HT)
        const bitola    = row[2]; // Coluna C (Bitola)
        const posicao   = row[3]; // Coluna D (Localização)
        const dataReg   = row[4]; // Coluna E (Data)
        const saldo     = row[7]; // Coluna H (Qtd_Atual)

        if (itemID) {
            const idFormatado = itemID.toString().trim();
            const qtdNum = (saldo !== undefined && saldo !== "") ? parseFloat(saldo) : 0;
            
            // FILTRO DE ÚLTIMA LINHA: Como a planilha é inserida via append,
            // as linhas inferiores são sempre mais recentes temporalmente.
            // Sobrescrevemos diretamente para salvar apenas o estado mais atual do lote.
            novosLotes[idFormatado] = {
                pos: posicao ? posicao.toString().trim() : "N/A",
                qtd: qtdNum,
                HT: ht ? ht.toString() : "-",
                BITOLA: bitola ? bitola.toString() : "-",
                dataUltima: dataReg ? dataReg.toString() : ""
            };
        }
    });

    lotes = novosLotes;
    localStorage.setItem('estoque_osg_cache', JSON.stringify(lotes));
    
    // Contagem de lotes únicos no estoque
    const qtdAtivos = Object.values(lotes).filter(item => item.qtd > 0).length;
    document.getElementById("info").innerText = `Estoque sincronizado: ${Object.keys(lotes).length} lotes mapeados (${qtdAtivos} com saldo).`;
}

// ================== SINCRONIZAÇÃO AUTOMÁTICA ==================
async function carregarDadosAutomáticos() {
    try {
        document.getElementById("info").innerText = "Sincronizando estoque com o SharePoint...";
        const response = await fetch(URL_TABELA_AUTOMATICA);
        if (!response.ok) throw new Error("Falha ao baixar planilha");
        
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        processarDadosExcel(rows);
    } catch (err) {
        console.warn("Sincronização em segundo plano indisponível. Usando dados locais.", err);
        document.getElementById("info").innerText = "Dados locais ativos: " + Object.keys(lotes).length + " lotes salvos.";
    }
}

carregarDadosAutomáticos();

// ================== UPLOAD MANUAL ==================
document.getElementById('input-excel').addEventListener('change', function(e) {
    const reader = new FileReader();
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("info").innerText = "Processando planilha...";

    reader.readAsArrayBuffer(file);
    reader.onload = function(e) {
        const data = new Uint8Array(reader.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        processarDadosExcel(rows);
        alert("Planilha atualizada com sucesso! Apenas os saldos mais recentes foram considerados.");
    };
});

// ================== CENA & THREE.JS ==================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(12, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

const loader = new GLTFLoader();

loader.load('estoque.glb', (gltf) => {
    modelo = gltf.scene;
    scene.add(modelo);
    console.log("Cenário 3D de estoque carregado!");

    const params = new URLSearchParams(window.location.search);
    const dadoUrl = params.get("pos") ? params.get("pos").trim() : null;

    if (dadoUrl) {
        setTimeout(() => {
            destacar(dadoUrl);
            gerarListaLotesPrateleira(dadoUrl);
        }, 1200); 
    }
});

// ================== BUSCA E INTERAÇÕES ==================
function buscarLote() {
    const valor = document.getElementById("busca").value.trim();
    const lote = lotes[valor];
    
    if (lote) {
        destacar(lote.pos);
        mostrarInfo(valor, lote);
        gerarListaLotesPrateleira(lote.pos);
    } else {
        alert("Item '" + valor + "' não foi encontrado no mapa.");
    }
}

document.getElementById('btnBuscar').addEventListener('click', buscarLote);
document.getElementById('busca').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') buscarLote();
});

function mostrarInfo(codigo, lote) {
    document.getElementById("info").innerHTML = `
      <div style="color: #002D72; font-weight: bold; border-bottom: 1px solid #ccc; margin-bottom: 5px;">DETALHES DO ITEM</div>
      <b>Lote:</b> ${codigo} <br>
      <b>Bitola:</b> ${lote.BITOLA} <br>
      <b>HT:</b> ${lote.HT} <br>
      <b>Saldo Atual:</b> <span style="color: ${lote.qtd > 0 ? 'green' : 'red'}; font-weight: bold;">${lote.qtd}</span> <br>
      <b>Última Movimentação:</b> ${lote.dataUltima || "-"} <br>
      <b>Localização:</b> <mark>${lote.pos}</mark>
    `;
}

window.addEventListener('click', onDocumentMouseDown, false);

function onDocumentMouseDown(event) {
    if (event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON' || event.target.tagName === 'LABEL') {
        return;
    }

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    if (modelo) {
        const intersects = raycaster.intersectObjects(modelo.children, true);

        if (intersects.length > 0) {
            let objClicado = intersects[0].object;
            while (objClicado && objClicado.parent && !objClicado.name) {
                objClicado = objClicado.parent;
            }

            if (objClicado && objClicado.name) {
                const nomePosicao = objClicado.name.trim();
                destacar(nomePosicao);
                gerarListaLotesPrateleira(nomePosicao);
            }
        }
    }
}

function gerarListaLotesPrateleira(nomePrateleira) {
    const painel = document.getElementById("painelPrateleira");
    const titulo = document.getElementById("tituloPrateleira");
    const containerLista = document.getElementById("listaLotesPrateleira");

    titulo.innerText = `POSIÇÃO: ${nomePrateleira}`;
    containerLista.innerHTML = ""; 

    let itensDaPrateleira = [];
    for (let codLote in lotes) {
        if (lotes[codLote].pos === nomePrateleira) {
            itensDaPrateleira.push({
                codigo: codLote,
                details: lotes[codLote]
            });
        }
    }

    if (itensDaPrateleira.length === 0) {
        containerLista.innerHTML = `<div style="text-align: center; color: #777; font-style: italic; margin-top: 20px;">Nenhum lote cadastrado nesta localização.</div>`;
    } else {
        itensDaPrateleira.forEach(item => {
            const card = document.createElement("div");
            card.className = "item-card";

            // HTML Atualizado com Data e Quantidade Atual no Armário
            card.innerHTML = `
                <div class="item-header">
                    <span>${item.codigo}</span>
                    <span style="font-size: 11px; color: ${item.details.qtd > 0 ? '#15803d' : '#b91c1c'}; font-weight: bold;">
                        Qtd: ${item.details.qtd}
                    </span>
                    <span class="indicador-expand">▶</span>
                </div>
                <div class="item-details">
                    <b>Bitola:</b> ${item.details.BITOLA} <br>
                    <b>HT:</b> ${item.details.HT} <br>
                    <b>Qtd Atual no Armário:</b> <span style="font-weight: bold; color: ${item.details.qtd > 0 ? 'green' : 'red'};">${item.details.qtd}</span> <br>
                    <b>Última Movimentação:</b> ${item.details.dataUltima || "-"}
                </div>
            `;

            const header = card.querySelector(".item-header");
            const details = card.querySelector(".item-details");

            header.addEventListener("click", () => {
                const ativo = card.classList.contains("ativo");
                
                document.querySelectorAll(".item-card").forEach(c => {
                    c.classList.remove("ativo");
                    c.querySelector(".item-details").style.display = "none";
                });

                if (!ativo) {
                    card.classList.add("ativo");
                    details.style.display = "block";
                }
            });

            containerLista.appendChild(card);
        });
    }

    painel.style.display = "flex"; 
}

function destacar(nome) {
    if (!modelo) return;

    if (objetoSelecionado) {
        objetoSelecionado.traverse((child) => {
            if (child.isMesh && child.material.originalColor) {
                child.material.color.copy(child.material.originalColor);
                child.material.emissive.set(0x000000);
            }
        });
    }

    const obj = modelo.getObjectByName(nome);
    if (!obj) return;

    objetoSelecionado = obj;
    obj.traverse((child) => {
        if (child.isMesh) {
            if (!child.material.originalColor) {
                child.material = child.material.clone();
                child.material.originalColor = child.material.color.clone();
            }
            child.material.color.set(0xff0000); 
            child.material.emissive = new THREE.Color(0x440000);
        }
    });

    focarObjeto(obj);
}

function focarObjeto(obj) {
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length();

    controls.target.copy(center);

    let startPos = camera.position.clone();
    let endPos = new THREE.Vector3(center.x + size, center.y + size, center.z + size);

    let t = 0;
    function animarFoco() {
        if (t < 1) {
            t += 0.03;
            camera.position.lerpVectors(startPos, endPos, t);
            requestAnimationFrame(animarFoco);
        }
    }
    animarFoco();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    if (objetoSelecionado) {
        objetoSelecionado.traverse((child) => {
            if (child.isMesh) {
                const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
                child.material.emissiveIntensity = pulse;
            }
        });
    }
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
